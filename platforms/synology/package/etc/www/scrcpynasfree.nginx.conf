# ScrcpyNas投屏 DSM Webman 入口
#
# 对外只暴露 /webman/zgcwkj/scrcpynasfree/，回源到只监听 127.0.0.1
# 的套件服务。页面、API、WebSocket 都走同一个反代入口
# 路径和端口与 Go 版 scrcpynas 套件错开，两版可同时安装

location ^~ /webman/zgcwkj/scrcpynasfree/ {
    include proxy.conf;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Dsm-Server-Addr $server_addr;
    proxy_set_header Connection $http_connection;
    proxy_pass http://127.0.0.1:8131;
}
